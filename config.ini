; Shared PC/Pi defaults. Do not overwrite on the Pi: Pi-specific values live there.
; Keep comments ASCII-only (file transfer tools may corrupt non-ASCII text).
[app]
; console log level: warning (default) | info | debug   (command line -v / -vv overrides)
log_level = warning
; true: show the dev-only skip button on the login page
skip_login = true
; true: show the built-in touch keyboard when a text field is focused
virtual_keyboard = true

[display]
; auto: choose by screen orientation (1280x800 landscape / 480x800 portrait) | landscape | portrait
profile = auto
; screen name to use when several displays are connected (e.g. DSI-1). Empty = primary screen
screen =
; true: fullscreen (hides the top panel). Recommended on the Pi
fullscreen = false
; portrait only: unused space (px) kept at the bottom when the visible area is smaller than the panel. Raise it if the bottom is still cut
bottom_margin = 20

[uart]
port = /dev/serial0
baudrate = 115200
; true: use the built-in virtual firmware (no module needed). Same as: python main.py --mock
mock = false

[sensor]
; sensor enabled on first run (the choice is then saved in data/sensor.json): builtin = UART, patch = Bluetooth, off
default = builtin
; patch sensor = BLE Nordic UART Service (same packets as the wired UART)
; advertised name prefix to look for (device name e.g. nFor30-001)
patch_name = nFor
; fixed BLE address (optional, empty = search by name / NUS service)
patch_address =

[measure]
; reaction wait in seconds before the T1 start button is enabled (T1 = blood reaction)
reaction_wait_s = 900
; auto: wait timer starts when T0 finishes / manual: user presses a button when blood is applied
reaction_timer_start = auto
; true: T2 starts without user acceptance (decide with the model owner)
auto_start_last = false
; sweep (confirmed: 10 Hz - 200 kHz, 101 points) and sensors CH0..CH2
sweep_start_hz = 10
sweep_stop_hz = 200000
sweep_points = 101
channels = 0,1,2
rtia_ohm = 1000
; minutes from batch start to T0 (empty = model assumes its Day-1 median and warns)
elapsed_min =
; c0 (T2 reference): first = result of the first measurement (stage 1, sensors 0-2) / none = historical Day-1 value + warning
c0_source = first
results_dir = results
; true: the first stage needs the required patient fields (name, sex, age, weight)
require_patient = true

[result]
; shown on the result card. Leave unit / ref_* empty until the model owner confirms them:
; with no reference range the screen shows the number only and makes no normal/abnormal judgement.
title = Troponin
unit =
ref_low =
ref_high =
method = EIS

[network]
; true: Wi-Fi/Bluetooth settings use a virtual backend (PC testing; Windows is automatic)
mock = false

[server]
base_url =
